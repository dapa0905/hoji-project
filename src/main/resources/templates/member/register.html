<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #f8f9fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .signup-card {
      background-color: #ffffff;
      padding: 2rem 2.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }
    .signup-card h2 {
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #212529;
      text-align: center;
    }
    .form-label {
      color: #495057;
      font-weight: 500;
    }
    .form-control {
      border: 1px solid #ced4da;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      color: #212529;
      background-color: #fefefe;
      border-radius: 0.375rem;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    .form-control:focus {
      border-color: #495057;
      box-shadow: 0 0 0 0.25rem rgba(73, 80, 87, 0.25);
      outline: none;
    }
    .btn-signup {
      width: 100%;
      padding: 0.6rem;
      background-color: #212529;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      border-radius: 0.375rem;
      transition: background-color 0.3s ease;
    }
    .btn-signup:hover {
      background-color: #495057;
    }
  </style>
</head>
<body>
  <div class="signup-card shadow-sm">
    <h2>회원가입</h2>
    <form action="/member/register" method="post" autocomplete="off">
      <div class="mb-3">
        <label for="name" class="form-label">이름</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="이름을 입력하세요" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">이메일</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="이메일을 입력하세요" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">비밀번호</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required />
      </div>
      <div class="mb-3">
        <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
        <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required />
      </div>
      <button type="submit" class="btn btn-signup">회원가입</button>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
