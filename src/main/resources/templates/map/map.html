<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MainMap</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f1f1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .map-container {
      display: flex;
      height: 100vh;
    }

    .map-section {
      flex: 3;
      background-color: #e9ecef;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .sidebar {
      flex: 1;
      background-color: #ffffff;
      border-left: 1px solid #dee2e6;
      padding: 1.5rem;
      overflow-y: auto;
    }

    .sidebar h4 {
      color: #212529;
      font-weight: 600;
      margin-bottom: 1.2rem;
    }

    .address-card {
      background-color: #f8f9fa;
      padding: 1rem;
      border-radius: 0.375rem;
      margin-bottom: 1rem;
      border: 1px solid #dee2e6;
    }

    .address-card p {
      margin: 0;
      color: #495057;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="map-container">
    <!-- 지도 영역 -->
    <div class="map-section">
      <div id="map"></div>
    </div>

    <!-- 사이드바 영역 -->
    <div class="sidebar">
      <h4>등록된 주소</h4>
      <!-- 예시 주소 카드 -->
      <div class="address-card">
        <p>서울특별시 중구 세종대로 110</p>
      </div>
      <div class="address-card">
        <p>부산광역시 해운대구 우동 123</p>
      </div>
      <!-- 주소는 추후 동적으로 렌더링 -->
    </div>
  </div>

  <!-- Google Maps JavaScript API -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB7wAv0Nmng9RFiUymD9mzJHLLa0dta4uY&callback=initMap"
    async
    defer
  ></script>

  <script>
    function initMap() {
      const center = { lat: 35.658034, lng: 139.701636 }; 
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 15,
        center: center,
      });

      // 마커 예시
      new google.maps.Marker({
        position: center,
        map: map,
        title: "Shibuya Station",
      });
    }
  </script>
</body>
</html>
